name: Bug report
description: Something in Forge does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands or code. Remove secrets and personal data.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`forge version`, `go version`, database and version, OS"
    validations:
      required: true
