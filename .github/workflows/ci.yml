name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned by commit SHA and container images by digest (the
# version is in the comment or tag); Dependabot proposes updates for the
# actions. See docs/SUPPLY_CHAIN.md.
permissions:
  contents: read

# setup-go installs the exact Go release go.mod names (go-version-file),
# the version the supply-chain gate requires (docs/SUPPLY_CHAIN.md).

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mysql:
        image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: forge
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FORGE_TEST_POSTGRES_URL: postgres://forge:forge@127.0.0.1:5432/postgres?sslmode=disable
      FORGE_TEST_MYSQL_URL: mysql://root:forge@127.0.0.1:3306/mysql
      # Database tests fail instead of skipping when a server is missing.
      FORGE_TEST_REQUIRE_DATABASE: "true"
      # forge deploy's SSH tests (internal/deploy) fail instead of skipping
      # when sshd, ssh or ssh-keygen is missing.
      FORGE_TEST_REQUIRE_SSHD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build the linter with the job's Go toolchain: a prebuilt binary
          # made with an older Go cannot read newer export data and fails
          # every package with "export data version ... is greater than
          # maximum supported version".
          install-mode: goinstall
      - name: PostgreSQL 18 client tools
        # forge db schema dump needs a pg_dump of the server's major version
        # or newer; the runner image ships an older one.
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: OpenSSH server for the deploy SSH tests
        # The tests start their own unprivileged sshd on 127.0.0.1; the
        # system service the package starts is not used.
        run: |
          sudo apt-get install -y -q --no-install-recommends openssh-server openssh-client
          # The tests start their own sshd; the system service is not needed.
          sudo systemctl disable --now ssh.service ssh.socket || true
      - name: Test (race)
        run: go test -race -count=1 ./...
      - name: Benchmarks
        run: go test -run='^$' -bench=. -benchmem ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  coverage:
    # Statement coverage of the module with go test -coverpkg=./..., the
    # database tests included (PostgreSQL 18 and 16, MariaDB) and the real
    # sshd. scripts/coverage.sh writes the total and a per-package table to
    # the step summary and fails below .coverage-floor, which only ever rises
    # toward 95 (docs/TESTING.md, "Coverage").
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres16:
        image: postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mariadb:
        image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
        env:
          MARIADB_ROOT_PASSWORD: forge
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FORGE_TEST_POSTGRES_URL: postgres://forge:forge@127.0.0.1:5432/postgres?sslmode=disable
      FORGE_TEST_DATABASE_URL: postgres://forge:forge@127.0.0.1:5433/postgres?sslmode=disable
      FORGE_TEST_MYSQL_URL: mysql://root:forge@127.0.0.1:3306/mysql
      FORGE_TEST_REQUIRE_DATABASE: "true"
      FORGE_TEST_REQUIRE_SSHD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: PostgreSQL 18 client tools and OpenSSH server
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18 openssh-server openssh-client
          # The tests start their own sshd; the system service is not needed.
          sudo systemctl disable --now ssh.service ssh.socket || true
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Coverage
        run: scripts/coverage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: dist/coverage
          if-no-files-found: ignore

  benchmarks:
    # Smoke test, not a gate: every benchmark must keep compiling and running
    # (one iteration each). Shared runners are too noisy to compare numbers, so
    # none are compared or stored; see docs/BENCHMARKS.md for how to measure.
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every benchmark once
        run: go test -run '^$' -bench . -benchtime=1x ./...

  fuzz:
    # Every fuzz target, found by scripts/fuzz.sh with go test -list, for a
    # short time each. The nightly Fuzz workflow (fuzz.yml) runs them longer.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz every target for 10s
        run: scripts/fuzz.sh -t 10s
      - name: Collect failing inputs
        if: failure()
        run: scripts/fuzz.sh -c "$RUNNER_TEMP/fuzz-failures"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore

  sbom:
    # CycloneDX SBOMs of the forge CLI and forge-proxy binaries; the release
    # workflow attaches SPDX SBOMs and provenance to the published images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the binaries and their SBOMs
        run: scripts/sbom.sh "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-binaries
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error

  mariadb:
    # The mysql adapter also serves MariaDB, whose error codes and statement
    # timeout differ: run its tests against a real MariaDB too.
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
        env:
          MARIADB_ROOT_PASSWORD: forge
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FORGE_TEST_MYSQL_URL: mysql://root:forge@127.0.0.1:3306/mysql
      FORGE_TEST_REQUIRE_DATABASE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test the mysql adapter against MariaDB
        run: go test -race -count=1 ./mysql/...
      - name: Test generated applications and resources against MariaDB
        run: go test -count=1 -timeout 30m -run 'TestGeneratedApplication/database_workflow_(mysql|mariadb)$' ./internal/cli

  docker:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mysql, mariadb, sqlite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build example image
        if: matrix.database == 'postgresql'
        run: docker build -t forge-example:ci .
      - name: Generate an application
        run: go run ./cmd/forge new ciapp --database "${{ matrix.database }}" --dir "$RUNNER_TEMP/ciapp" --forge-path "$GITHUB_WORKSPACE"
      - name: Build the generated production image
        run: docker build -t ciapp:ci "$RUNNER_TEMP/ciapp"
      - name: SBOM of the generated image
        if: matrix.database == 'postgresql'
        # The Syft command of the generated CI (internal/scaffold/templates/ci.yml.tmpl).
        run: |
          docker save ciapp:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm --network none -e SYFT_CHECK_FOR_APP_UPDATE=false -v "$RUNNER_TEMP:/scan" \
            ghcr.io/anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa \
            scan docker-archive:/scan/image.tar --source-name ciapp -o cyclonedx-json=/scan/sbom.cdx.json
          jq -e '.bomFormat == "CycloneDX" and ([.components[] | select(.name == "github.com/rocketinsidecorp/forge-go")] | length) == 1' "$RUNNER_TEMP/sbom.cdx.json"
      - name: Smoke test the generated compose stack
        working-directory: ${{ runner.temp }}/ciapp
        run: |
          docker compose up --build --detach --wait
          curl -fsS http://127.0.0.1:8080/v1/status
          curl -fsS http://127.0.0.1:8080/health/ready | grep -q '"healthy":true'
          docker compose run --rm migrate migrate status
      - name: Validate the observability overlay
        working-directory: ${{ runner.temp }}/ciapp
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
        run: |
          docker compose -f compose.yaml -f compose.observability.yaml config --quiet
          # The default stack must not need the password or mention the overlay.
          env -u GRAFANA_ADMIN_PASSWORD docker compose config --quiet
          if docker compose config --services | grep -E 'grafana|prometheus|tempo|loki|otel-collector'; then
            echo "the default compose.yaml must not include the observability stack"; exit 1
          fi
      - name: Smoke test the observability stack
        if: matrix.database == 'postgresql'
        working-directory: ${{ runner.temp }}/ciapp
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
        run: |
          overlay="-f compose.yaml -f compose.observability.yaml"
          docker compose $overlay up --build --detach --wait
          wait_for() { # description, command...
            local what="$1"; shift
            for _ in $(seq 1 45); do
              if "$@" >/dev/null 2>&1; then echo "ok: $what"; return 0; fi
              curl -fsS http://127.0.0.1:8080/v1/status >/dev/null 2>&1 || true
              sleep 2
            done
            echo "timed out waiting for: $what"; return 1
          }
          grafana() { curl -fsS -u "admin:$GRAFANA_ADMIN_PASSWORD" "$@"; }
          wait_for "grafana is up" grafana http://127.0.0.1:3000/api/health
          wait_for "anonymous grafana access is refused" sh -c 'test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/datasources)" = 401'
          for source in prometheus tempo loki; do
            wait_for "$source data source is healthy" grafana "http://127.0.0.1:3000/api/datasources/uid/$source/health"
          done
          wait_for "the dashboard is provisioned" grafana http://127.0.0.1:3000/api/dashboards/uid/forge-app
          wait_for "metrics reach Prometheus" sh -c "curl -fsS --get http://127.0.0.1:9090/api/v1/query --data-urlencode 'query=http_server_request_duration_seconds_count{job=\"ciapp\"}' | grep -q '\"result\":\[{'"
          wait_for "Go runtime metrics reach Prometheus" sh -c "curl -fsS --get http://127.0.0.1:9090/api/v1/query --data-urlencode 'query=go_goroutine_count{job=\"ciapp\"}' | grep -q '\"result\":\[{'"
          wait_for "traces reach Tempo" sh -c "curl -fsS -u 'admin:$GRAFANA_ADMIN_PASSWORD' 'http://127.0.0.1:3000/api/datasources/proxy/uid/tempo/api/search?limit=5' | grep -q traceID"
          wait_for "logs reach Loki" sh -c "curl -fsS -u 'admin:$GRAFANA_ADMIN_PASSWORD' --get 'http://127.0.0.1:3000/api/datasources/proxy/uid/loki/loki/api/v1/query_range' --data-urlencode 'query={service_name=\"ciapp\"}' | grep -q '\"result\":\[{'"
      - name: Observability stack logs
        if: failure()
        working-directory: ${{ runner.temp }}/ciapp
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
        run: docker compose -f compose.yaml -f compose.observability.yaml logs --no-color --tail 200
      - name: Compose logs
        if: failure()
        working-directory: ${{ runner.temp }}/ciapp
        run: docker compose logs
      - name: Stop the stack
        if: always()
        working-directory: ${{ runner.temp }}/ciapp
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
        run: docker compose -f compose.yaml -f compose.observability.yaml down --volumes
