name: Fuzz

# Continuous fuzzing: every night, each fuzz target runs for a longer time
# than the 10 seconds CI gives it on a pull request, on its own runner. The
# corpus each target grows is cached for the next night; a failing input is
# uploaded as an artifact (fuzz-failures-<package>-<target>). Reproduce one
# locally by copying it into the package's testdata/fuzz/<target>/ and
# running go test -run '<target>/<file>' ./<package>. See
# docs/SUPPLY_CHAIN.md.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target, as go test -fuzztime takes it (10m, 1h)
        required: false
        default: 10m

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: List the fuzz targets
        id: list
        run: echo "matrix=$(scripts/fuzz.sh -j)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.id }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # The corpus is cached per target below; the module and build
          # cache would only carry one target's corpus into the others'.
          cache: false
      - name: Locate the corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.id }}-
      - name: Fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: scripts/fuzz.sh -t "$FUZZTIME" -r "^${TARGET}\$" "$PACKAGE"
      - name: Collect failing inputs
        if: failure()
        run: scripts/fuzz.sh -c "$RUNNER_TEMP/fuzz-failures"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.id }}
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
          retention-days: 30
