name: Release

# Builds a release for a version tag, and only for one: no pull request,
# branch push or schedule runs this workflow.
#
# - Images: the forge-proxy and example images are pushed to ghcr.io with SLSA
#   provenance and an SPDX SBOM attached by BuildKit, then signed keyless with
#   Sigstore cosign through GitHub's OIDC token: the signature's certificate
#   names this workflow file and the tag.
# - Binaries: forge and forge-proxy archives for linux, darwin and windows on
#   amd64 and arm64 (scripts/release-build.sh, plain go build), the binary
#   SBOMs, and checksums.txt over all of them, signed keyless with cosign
#   (checksums.txt.sigstore.json) and attested with GitHub build provenance.
# - Release: a DRAFT GitHub release with those files. Nothing is published
#   until a maintainer verifies it and publishes the draft (docs/RELEASING.md).
#
# Verify with the commands in docs/SUPPLY_CHAIN.md.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is the module's version, on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag is not a version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          # A Go module's version is its tag; from v2 on the module path must
          # end in /vN (go.mod), or `go get` refuses the tag.
          module="$(awk '$1 == "module" { print $2; exit }' go.mod)"
          major="${GITHUB_REF_NAME%%.*}"
          case "$major" in
            v0 | v1) want="" ;;
            *) want="/$major" ;;
          esac
          base="$module"
          if [[ "${module##*/}" =~ ^v[0-9]+$ ]]; then
            base="${module%/*}"
          fi
          if [ "$base$want" != "$module" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the module path $module of go.mod"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on $DEFAULT_BRANCH"
            exit 1
          fi

  images:
    name: Image ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image and its signature to ghcr.io
      id-token: write # keyless signing: Sigstore certifies this workflow's identity
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: forge-proxy
            dockerfile: cmd/forge-proxy/Dockerfile
          - image: forge-example
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          NAME: ${{ matrix.image }}
        # Registry paths are lowercase; the owner's name may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          # SLSA provenance with the build's full inputs, and an SPDX SBOM
          # from BuildKit's Syft scanner, pinned by digest (stable-1 tag).
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Signs the multi-platform index by digest, never by tag; the index
        # references the provenance and SBOM, so the signature covers them.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "- \`${IMAGE}:${GITHUB_REF_NAME}\` = \`${IMAGE}@${DIGEST}\`, signed" >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: Binary SBOMs
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release builds from a clean module and build cache.
          cache: false
      - name: Build the forge and forge-proxy binaries and their SBOMs
        env:
          GOARCH: ${{ matrix.arch }}
        run: scripts/sbom.sh "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 90

  binaries:
    name: Binaries, checksums and provenance
    needs: [verify, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # keyless signing and attestations: Sigstore certifies this workflow's identity
      attestations: write # store the build provenance attestations of the release files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release builds from a clean module and build cache.
          cache: false
      - name: Build the archives
        # forge and forge-proxy for 6 platforms: static, -trimpath, with the
        # tag, commit and commit time stamped in; reproducible bytes.
        run: scripts/release-build.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-${{ github.ref_name }}-linux-*
          path: ${{ runner.temp }}/sbom
      - name: Checksums of the archives and SBOMs
        run: |
          scripts/release-checksums.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release" "$RUNNER_TEMP/sbom"
          { echo '```'; cat "$RUNNER_TEMP/release/checksums.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums
        # Keyless, like the images: the certificate in the bundle names this
        # workflow file and the tag, and the signature is logged in Rekor.
        run: cosign sign-blob --yes --bundle "$RUNNER_TEMP/release/checksums.txt.sigstore.json" "$RUNNER_TEMP/release/checksums.txt"
      - name: Verify the signature
        run: |
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/release/checksums.txt.sigstore.json" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/release/checksums.txt"
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One attestation whose subjects are the lines of checksums.txt: every archive and SBOM.
          subject-checksums: ${{ runner.temp }}/release/checksums.txt
      - name: Keep the attestations with the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # For offline verification: gh attestation verify FILE --bundle provenance.jsonl
        run: cp "$BUNDLE" "$RUNNER_TEMP/release/provenance.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90

  draft:
    name: Draft the GitHub release
    needs: [images, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and attach its files; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # A draft only: it is published by hand after the verification in
        # docs/RELEASING.md. The tag already exists; --verify-tag keeps gh
        # from creating one.
        run: scripts/release-draft.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
