version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gocritic:
      # The diagnostic checks find bugs (wrong argument order, impossible
      # conditions); the style and performance tags are matters of taste.
      enabled-tags:
        - diagnostic
    revive:
      # Only the exported rule: every exported identifier carries a doc comment
      # that starts with its name (audit D-6).
      rules:
        - name: exported
          arguments:
            # Renaming exported types to avoid stutter would break the public API.
            - disableStutteringCheck
    errcheck:
      # Writes of CLI diagnostics and usage text: if the terminal is gone there
      # is nobody left to report the failure to.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests read files they created in t.TempDir, run the go tool on
      # generated projects and echo input in fixture handlers; gosec guards
      # production code.
      - path: _test\.go
        linters:
          - gosec
      # The context, error-chain and resource linters guard production code.
      # Tests talk to httptest servers and in-memory fakes with the request
      # helpers' plain forms (http.Get, net.Listen, == on sentinel errors) and
      # leave cleanup to t.Cleanup, which these analyzers do not follow.
      # gocritic's diagnostic checks stay on in tests.
      - path: _test\.go
        linters:
          - bodyclose
          - contextcheck
          - errorlint
          - nilerr
          - noctx
          - rowserrcheck
          - sqlclosecheck
      # Deliberate exceptions in files that a parallel change (QG9) owns while
      # this one lands; that change converts each to an inline
      # `//nolint:<linter> // reason` and deletes its rule here.
      #   cache/json.go: an undecodable cached value is a miss, not an error.
      #   cachetest.go: the key "a " proves keys are space-sensitive.
      #   credentials/files.go: syncDir is best effort (some platforms cannot
      #     open a directory); the `err =` reuse is the file's style.
      #   jobs/scheduler.go: StopContext documents that a nil ctx waits
      #     without a deadline.
      #   runtime.go: New takes options, not a context; serving owns the
      #     lifetime of the application it builds.
      - path: ^cache/json\.go$
        linters:
          - nilerr
      - path: ^cache/cachetest/cachetest\.go$
        linters:
          - gocritic
      - path: ^credentials/files\.go$
        linters:
          - gocritic
          - nilerr
      - path: ^jobs/scheduler\.go$
        linters:
          - contextcheck
      - path: ^runtime\.go$
        linters:
          - contextcheck
      # The generated application's bootstrap.go (internal/scaffold/templates)
      # starts the routes with context.Background(), which the application
      # tests copy this configuration to lint. The same change owns the
      # template; this rule is deleted when it passes a context. The
      # framework's own examples/ are not under this path.
      - path: ^app/bootstrap/bootstrap\.go$
        linters:
          - contextcheck

formatters:
  enable:
    - gofmt
