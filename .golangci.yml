version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gocritic:
      # The diagnostic checks find bugs (wrong argument order, impossible
      # conditions); the style and performance tags are matters of taste.
      enabled-tags:
        - diagnostic
    revive:
      # Only the exported rule: every exported identifier carries a doc comment
      # that starts with its name (audit D-6).
      rules:
        - name: exported
          arguments:
            # Renaming exported types to avoid stutter would break the public API.
            - disableStutteringCheck
    errcheck:
      # Writes of CLI diagnostics and usage text: if the terminal is gone there
      # is nobody left to report the failure to.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests read files they created in t.TempDir, run the go tool on
      # generated projects and echo input in fixture handlers; gosec guards
      # production code.
      - path: _test\.go
        linters:
          - gosec
      # The context, error-chain and resource linters guard production code.
      # Tests talk to httptest servers and in-memory fakes with the request
      # helpers' plain forms (http.Get, net.Listen, == on sentinel errors) and
      # leave cleanup to t.Cleanup, which these analyzers do not follow.
      # gocritic's diagnostic checks stay on in tests.
      - path: _test\.go
        linters:
          - bodyclose
          - contextcheck
          - errorlint
          - nilerr
          - noctx
          - rowserrcheck
          - sqlclosecheck

formatters:
  enable:
    - gofmt
