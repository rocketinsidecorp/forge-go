# Prometheus alert rules for the local observability stack.
#
# They use only the metrics Forge exports (docs/OBSERVABILITY.md) under the
# Prometheus names the OTLP receiver gives them. The stack has no
# Alertmanager: firing alerts are listed at http://127.0.0.1:9090/alerts and in
# Grafana (Alerting > Alert rules > Prometheus). Thresholds are starting
# points for an SLO of roughly "95% of requests under 500 ms, under 5% errors":
# change them to yours. Check the file with
#   promtool check rules observability/alerts.yml
# when promtool is installed.
groups:
  - name: forge-availability
    rules:
      # A scrape target is down. The local stack scrapes only Prometheus
      # itself; this also covers the application's /metrics listener
      # (FORGE_TELEMETRY_METRICS_ADDR) once you add it to scrape_configs.
      - alert: ForgeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Prometheus has failed to scrape {{ $labels.instance }} of job {{ $labels.job }} for 2 minutes."

      # The application pushes its metrics over OTLP, so there is no target
      # to be "down": a stopped or disconnected application shows up as its
      # always-present Go runtime gauge no longer arriving.
      - alert: ForgeApplicationMetricsMissing
        expr: absent_over_time(go_goroutine_count[5m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No metrics received from the application"
          description: "No go_goroutine_count sample arrived for 5 minutes: the application is down, or it cannot reach the OpenTelemetry Collector (see forge_telemetry_export_errors_total)."

  - name: forge-http
    rules:
      - alert: ForgeHighServerErrorRatio
        expr: |
          sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_class="5xx"}[5m]))
            / sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of requests to {{ $labels.job }} fail with 5xx"
          description: "The 5xx ratio of {{ $labels.job }} has been {{ $value | humanizePercentage }} over 5 minutes."

      - alert: ForgeHighRequestLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency of {{ $labels.job }} is above 500 ms"
          description: "The 95th percentile request duration of {{ $labels.job }} has been {{ $value | humanizeDuration }} for 10 minutes."

  - name: forge-database
    rules:
      - alert: ForgeDatabasePoolSaturated
        expr: |
          sum by (job, db_system_name, db_client_connection_pool_name) (db_client_connection_count{db_client_connection_state="used"})
            / sum by (job, db_system_name, db_client_connection_pool_name) (db_client_connection_max) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database pool {{ $labels.db_client_connection_pool_name }} of {{ $labels.job }} is over 90% in use"
          description: "{{ $value | humanizePercentage }} of the {{ $labels.db_system_name }} pool's connections have been in use for 5 minutes."

      - alert: ForgeDatabasePoolWaiters
        expr: |
          sum by (job, db_system_name, db_client_connection_pool_name) (rate(forge_db_pool_wait_duration_seconds_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Callers wait for a connection of pool {{ $labels.db_client_connection_pool_name }} of {{ $labels.job }}"
          description: "On average more than half a caller has been blocked waiting for a database connection for 10 minutes: raise FORGE_DATABASE_MAX_CONNS or shorten the queries."

  - name: forge-jobs
    rules:
      - alert: ForgeQueueJobsDead
        expr: |
          sum by (job, forge_job_kind) (increase(forge_queue_job_duration_seconds_count{forge_job_outcome="dead"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Queue jobs of kind {{ $labels.forge_job_kind }} of {{ $labels.job }} failed for good"
          description: "{{ $value }} job(s) exhausted their attempts in the last 15 minutes."

      - alert: ForgeScheduledJobFailing
        expr: |
          sum by (job, forge_scheduler_job) (increase(forge_scheduler_job_duration_seconds_count{forge_scheduler_outcome=~"failed|timeout"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.forge_scheduler_job }} of {{ $labels.job }} is failing"
          description: "The job failed or timed out in the last 15 minutes."
