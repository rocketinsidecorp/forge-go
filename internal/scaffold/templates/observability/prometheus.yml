# Prometheus for the local observability stack.
#
# The application does not need a scrape target: it pushes its metrics over
# OTLP to the collector, which forwards them to Prometheus's OTLP receiver
# (started with --web.enable-otlp-receiver). OTLP names are translated to the
# Prometheus names documented in docs/OBSERVABILITY.md, for example
# http.server.request.duration -> http_server_request_duration_seconds, and
# the resource attribute service.name becomes the job label.
#
# alerts.yml holds the alert rules (docs/OBSERVABILITY.md#alert-rules). There
# is no Alertmanager here: firing alerts are listed at /alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
